<!DOCTYPE html>
<html>

<head>
    <title>Carrier Database</title>

    <style>

        body{
            margin:0;
            font-family:Segoe UI, Arial, sans-serif;
            background:#f4f6f9;
        }

        .hero{
            background-image:
            linear-gradient(
                rgba(0,0,0,0.45),
                rgba(0,0,0,0.45)
            ),
            url('antenna.jpg');

            background-size:cover;
            background-position:center;
            height:320px;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .hero-text{
            color:white;
            text-align:center;
            padding:20px 40px;
        }

        .hero-text h1{
            margin:0;
            font-size:40px;
        }

        .hero-text p{
            font-size:18px;
        }

        .container{
            padding:30px;
        }

        .card{
            background:white;
            max-width:900px;
            padding:25px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.15);
            margin:auto;
        }

        h2{
            color:#004080;
        }

        .stats{
            display:flex;
            gap:12px;
            margin-bottom:25px;
            flex-wrap:wrap;
        }

        .stat-box{
            background:#0078d4;
            color:white;
            padding:15px;
            border-radius:8px;
            min-width:140px;
            text-align:center;
            font-weight:bold;
        }

        label{
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            box-sizing:border-box;
        }

        textarea{
            resize:vertical;
        }

        button{
            background:#0078d4;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#005a9e;
        }

    </style>

</head>

<body>

    <div class="hero">
        <div class="hero-text">
            <h1>📡 SES Carrier Database</h1>
            <p>RF Operations • Carrier Planning • SQM Replacement</p>
        </div>
    </div>

    <div class="container">

        <div class="card">

            <h2>Carrier Details</h2>

            <div class="stats">

                <div class="stat-box">
                    📡<br>
                    32 Antennas
                </div>

                <div class="stat-box">
                    🛰<br>
                    17 Satellites
                </div>

                <div class="stat-box">
                    📶<br>
                    17,424 Carriers
                </div>

                <div class="stat-box">
                    👥<br>
                    250 Customers
                </div>

            </div>

            <label>Antenna</label><br>
            <select id="antenna">
                <option>Select Antenna</option>
                <option>FUS-C12</option>
                <option>FUS-K24</option>
            </select>

            <br><br>

            <label>Carrier ID</label><br>
            <select id="carrierid">
                <option>Select Carrier</option>
                <option>TEST001</option>
                <option>TEST002</option>
            </select>

            <br><br>

            <label>Customer</label><br>
            <input type="text" id="customer">

            <br><br>

            <label>Satellite</label><br>
            <input type="text" id="satellite">

            <br><br>

            <label>TxRx</label><br>
            <input type="text" id="txrx">

            <br><br>

            <label>Modem</label><br>
            <input type="text" id="modem">

            <br><br>

            <label>Planned CF</label><br>
            <input type="text" id="plannedcf">

            <br><br>

            <label>Carrier Rate</label><br>
            <input type="text" id="rate">

            <br><br>

            <label>Remarks</label><br>
            <textarea id="remarks" rows="4"></textarea>

            <br><br>

            <button>💾 Save Carrier</button>

        </div>

    </div>

</body>

</html>
