<!DOCTYPE html>
<html>

<head>
    <title>SES Carrier Database</title>

    <style>

        body{
            margin:0;
            font-family:Segoe UI, Arial, sans-serif;
            background:#f4f6f9;
        }

        .hero{
            background-image:
            linear-gradient(
                rgba(0,0,0,0.45),
                rgba(0,0,0,0.45)
            ),
            url('antenna.jpg');

            background-size:cover;
            background-position:center;
            height:320px;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .hero-text{
            color:white;
            text-align:center;
            padding:20px 40px;
        }

        .hero-text h1{
            margin:0;
            font-size:42px;
        }

        .hero-text p{
            font-size:18px;
        }

        .container{
            padding:30px;
        }

        .card{
            background:white;
            max-width:1000px;
            padding:25px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.15);
            margin:auto;
        }

        h2{
            color:#004080;
            border-bottom:2px solid #0078d4;
            padding-bottom:5px;
        }

        .stats{
            display:flex;
            gap:10px;
            margin-bottom:25px;
            flex-wrap:wrap;
        }

        .stat-box{
            background:#0078d4;
            color:white;
            padding:15px;
            border-radius:8px;
            min-width:160px;
            text-align:center;
            font-weight:bold;
        }

        label{
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            box-sizing:border-box;
        }

        textarea{
            resize:vertical;
        }

        button{
            background:#0078d4;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:6px;
            cursor:pointer;
            margin-right:10px;
        }

        button:hover{
            background:#005a9e;
        }

        .section{
            margin-top:25px;
        }

    </style>

</head>

<body>

<div class="hero">
    <div class="hero-text">
        <h1>📡 SES Carrier Database</h1>
        <p>RF Operations • Carrier Planning • SQM Replacement</p>
    </div>
</div>

<div class="container">

<div class="card">

<div class="stats">

<div class="stat-box">
📡<br>
Antenna Paths
</div>

<div class="stat-box">
🛰<br>
BC Frequencies
</div>

<div class="stat-box">
📶<br>
Modems
</div>

<div class="stat-box">
🏢<br>
Equipment Rooms
</div>

</div>

<div class="section">

<h2>RF Infrastructure Details</h2>

<label>Teleport</label><br>
<select id="teleport">
<option>FUS</option>
</select>

<br><br>

<label>Building</label><br>
<select id="building">
<option>CB</option>
</select>

<br><br>

<label>Room</label><br>
<input type="text" id="room" placeholder="Room Number">

<br><br>

<label>Antenna Path</label><br>
<input type="text" id="antennapath" placeholder="FUS.C12.L.DL.1">

<br><br>

<label>Online Modem</label><br>
<select id="onlinemodem">
    <option>Select Modem</option>
    <option>01/CB/24/02/13/45</option>
    <option>01/CB/04/02/15</option>
    <option>fus-cb4-mdm730</option>
</select>

<br><br>

<label>BC Frequency (MHz)</label><br>
<select id="bcfreq">
    <option>4900</option>
    <option>5150</option>
    <option>10000</option>
    <option>10500</option>
    <option>10750</option>
    <option>12800</option>
    <option>17350</option>
    <option>27400</option>
</select>

<br><br>

<label>Line Amplifier</label><br>
<input type="text" id="lineamp" placeholder="fus-cb24-ampc227">

</div>

<div class="section">

<h2>Carrier Information</h2>

<label>Carrier ID</label><br>
<input type="text" id="carrierid">

<br><br>

<label>Customer</label><br>
<select id="customer">
    <option>Select Customer</option>
    <option>Telefonica</option>
    <option>Speedcast</option>
    <option>Intelsat</option>
    <option>United Nations</option>
</select>

<br><br>

<label>Satellite</label><br>
<select id="satellite">
    <option>Select Satellite</option>
    <option>SES-17</option>
    <option>Intelsat 37e</option>
    <option>SES-14</option>
    <option>Astra 1P</option>
</select>

<br><br>

<label>Planned CF</label><br>
<input type="text" id="plannedcf">

<br><br>

<label>Carrier Data Rate</label><br>
<input type="text" id="rate">

<br><br>

<label>Status</label><br>
<select id="status">
<option>Active</option>
<option>Planned</option>
<option>Maintenance</option>
<option>Testing</option>
<option>Decommissioned</option>
</select>

<br><br>

<label>Remarks</label><br>
<textarea id="remarks" rows="5"></textarea>

<br><br>

<button>💾 Save Carrier</button>
<button>📥 Export Excel</button>
<button>🔍 Search</button>

</div>

</div>

</div>

</body>

</html>
