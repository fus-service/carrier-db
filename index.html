<!DOCTYPE html>
<html>

<head>
<title>SES Carrier Database</title>

<style>

body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:#f4f6f9;
}

.hero{
    background-image:
    linear-gradient(
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.45)
    ),
    url('antenna.jpg');

    background-size:cover;
    background-position:center;
    height:320px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.hero-text{
    color:white;
    text-align:center;
    padding:20px 40px;
}

.hero-text h1{
    margin:0;
    font-size:42px;
}

.hero-text p{
    font-size:18px;
}

.container{
    padding:30px;
}

.card{
    background:white;
    max-width:1100px;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
    margin:auto;
}

h2{
    color:#004080;
    border-bottom:2px solid #0078d4;
    padding-bottom:5px;
}

.stats{
    display:flex;
    gap:10px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.stat-box{
    background:#0078d4;
    color:white;
    padding:15px;
    border-radius:8px;
    min-width:170px;
    text-align:center;
    font-weight:bold;
}

label{
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

textarea{
    resize:vertical;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    margin-right:10px;
    margin-bottom:10px;
}

button:hover{
    background:#005a9e;
}

.section{
    margin-top:25px;
}

</style>
</head>

<body>

<div class="hero">
    <div class="hero-text">
        <h1>📡 SES Carrier Database</h1>
        <p>RF Operations • Carrier Planning • SQM Replacement</p>
    </div>
</div>

<div class="container">

<div class="card">

<div class="stats">

<div class="stat-box">
📡<br>Antenna Paths
</div>

<div class="stat-box">
🛰<br>Satellites
</div>

<div class="stat-box">
📶<br>Modems
</div>

<div class="stat-box">
🏢<br>Equipment Rooms
</div>

</div>

<div class="section">

<h2>RF Infrastructure Details</h2>

<label>Teleport</label><br>
<select id="teleport">
<option>FUS</option>
</select>

<br><br>

<label>Building</label><br>
<select id="building">
<option>CB</option>
</select>

<br><br>

<label>Antenna</label><br>
<select id="antenna">
<option>Loading...</option>
</select>

<br><br>

<label>Room</label><br>
<input type="text" id="room">

<br><br>

<label>Antenna Path</label><br>
<input type="text" id="antennapath">

<br><br>

<label>Online Modem</label><br>
<input type="text" id="onlinemodem">

<br><br>

<label>BC Frequency (MHz)</label><br>
<input type="text" id="bcfreq">

<br><br>

<label>Line Amplifier</label><br>
<input type="text" id="lineamp">

</div>

<div class="section">

<h2>Carrier Information</h2>

<label>Carrier ID</label><br>
<input type="text" id="carrierid">

<br><br>

<label>Customer</label><br>
<select id="customer">
<option>Loading...</option>
</select>

<br><br>

<label>Satellite</label><br>
<select id="satellite">
<option>Loading...</option>
</select>

<br><br>

<label>Service ID</label><br>
<input type="text" id="serviceid">

<br><br>

<label>Service Name</label><br>
<input type="text" id="servicename">

<br><br>

<label>Bandwidth</label><br>
<input type="text" id="bandwidth">

<br><br>

<label>DataCare</label><br>
<input type="text" id="datacare">

<br><br>

<label>Change Number</label><br>
<input type="text" id="changenumber">

<br><br>

<label>Start Date</label><br>
<input type="date" id="startdate">

<br><br>

<label>End Date</label><br>
<input type="date" id="enddate">

<br><br>

<label>Transponder</label><br>
<input type="text" id="transponder">

<br><br>

<label>TX Frequency (MHz)</label><br>
<input type="text" id="txfreq">

<br><br>

<label>RX Frequency (MHz)</label><br>
<input type="text" id="rxfreq">

<br><br>

<label>TxRx</label><br>
<select id="txrx">
<option>TX</option>
<option>RX</option>
<option>TX+RX</option>
</select>

<br><br>

<label>Polarization</label><br>
<select id="pol">
<option>Left-Hand Circular</option>
<option>Right-Hand Circular</option>
<option>Horizontal</option>
<option>Vertical</option>
</select>

<br><br>

<label>Planned CF</label><br>
<input type="text" id="plannedcf">

<br><br>

<label>Carrier Data Rate</label><br>
<input type="text" id="rate">

<br><br>

<label>Status</label><br>
<select id="status">
<option>Loading...</option>
</select>

<br><br>

<label>Remarks</label><br>
<textarea id="remarks" rows="5"></textarea>

<br><br>

<button id="saveBtn">💾 Save Carrier</button>
<button>📥 Full Export</button>
<button>👥 Export Customer</button>
<button>🛰 Export Satellite</button>
<button>📡 Export Antenna</button>
<button>🔍 Search</button>

</div>

</div>

</div>

<script>

async function loadDropdown(csvFile, elementId){

    const response = await fetch(csvFile);
    const text = await response.text();

    const rows = text.trim().split('\n');

    const select =
        document.getElementById(elementId);

    if(!select) return;

    select.innerHTML = '';

    rows.slice(1).forEach(row => {

        if(row.trim()){

            const option =
                document.createElement('option');

            option.value = row.trim();
            option.textContent = row.trim();

            select.appendChild(option);

        }

    });

}

loadDropdown("customers.csv","customer");
loadDropdown("satellites.csv","satellite");
loadDropdown("status.csv","status");
loadDropdown("antennas.csv","antenna");

let infrastructureData = [];

fetch("infrastructure.csv")
.then(response => response.text())
.then(text => {

    const rows =
        text.trim().split('\n');

    infrastructureData =
        rows.slice(1).map(row => {

            const cols = row.split(',');

            return {

                AntennaPath: cols[0],
                OnlineModem: cols[1],
                BCFreq: cols[2],
                Teleport: cols[3],
                Building: cols[4],
                Room: cols[5],
                Lineamp: cols[6]

            };

        });

});

document
.getElementById("antenna")
.addEventListener("change", function(){

    const antenna =
        this.value.replace("FUS-","");

    const match =
        infrastructureData.find(
            x => x.AntennaPath.includes(antenna)
        );

    if(match){

        document.getElementById("antennapath").value =
            match.AntennaPath;

        document.getElementById("onlinemodem").value =
            match.OnlineModem;

        document.getElementById("bcfreq").value =
            match.BCFreq;

        document.getElementById("room").value =
            match.Room;

        document.getElementById("lineamp").value =
            match.Lineamp;

    }

});

</script>

</body>
</html>
